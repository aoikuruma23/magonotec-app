<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>まごのTEC - 登録完了</title>

  <meta name="theme-color" content="#E8A0A0">
  <meta name="description" content="まごのTEC - 登録完了ページ">

  <link rel="stylesheet" href="css/styles.css">
  <!-- QRコード生成ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    /* 成功ページ専用: bodyのoverflow:hiddenを解除 */
    html, body {
      overflow: auto !important;
      height: auto !important;
    }

    /* 成功ページ専用スタイル */
    .success-screen {
      min-height: 100vh;
      background: var(--color-bg);
      padding: 0;
    }

    .success-header {
      background: var(--color-white);
      padding: 16px 20px;
      text-align: center;
      border-bottom: 1px solid var(--color-border);
    }

    .success-header__logo {
      font-size: 22px;
      font-weight: bold;
      color: var(--color-primary);
    }

    .success-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .success-icon {
      text-align: center;
      margin-bottom: 16px;
    }

    .success-icon__circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: #D1FAE5;
      border-radius: 50%;
    }

    .success-icon__check {
      width: 36px;
      height: 36px;
      stroke: #059669;
      stroke-width: 3;
    }

    .success-title {
      font-size: 24px;
      font-weight: bold;
      color: var(--color-text);
      text-align: center;
      margin-bottom: 12px;
    }

    .success-subtitle {
      font-size: 16px;
      color: var(--color-text-secondary);
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .success-card {
      background: var(--color-white);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      margin-bottom: 24px;
    }

    .success-card__title {
      font-size: 18px;
      font-weight: bold;
      color: var(--color-text);
      margin-bottom: 16px;
      text-align: center;
    }

    .success-card__description {
      font-size: 14px;
      color: var(--color-text-secondary);
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .url-box {
      background: var(--color-bg);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      word-break: break-all;
      font-size: 14px;
      color: var(--color-text);
      line-height: 1.5;
    }

    .copy-button {
      width: 100%;
      padding: 16px 24px;
      font-size: 17px;
      font-weight: bold;
      color: var(--color-white);
      background: var(--color-primary);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-button:hover {
      opacity: 0.9;
    }

    .copy-button--copied {
      background: #059669;
    }

    .qr-section {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--color-border);
    }

    .qr-section__title {
      font-size: 15px;
      color: var(--color-text-secondary);
      margin-bottom: 16px;
    }

    .qr-code {
      display: inline-block;
      padding: 16px;
      background: var(--color-white);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .qr-code canvas {
      display: block;
    }

    .success-tips {
      background: #FEF3C7;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .success-tips__title {
      font-size: 15px;
      font-weight: bold;
      color: #D97706;
      margin-bottom: 8px;
    }

    .success-tips__list {
      font-size: 14px;
      color: #92400E;
      line-height: 1.8;
      padding-left: 20px;
      margin: 0;
    }

    .success-footer {
      text-align: center;
      padding: 20px;
    }

    .success-footer__link {
      color: var(--color-primary);
      text-decoration: underline;
      font-size: 14px;
    }

    .loading-state {
      text-align: center;
      padding: 60px 20px;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    .loading-text {
      font-size: 16px;
      color: var(--color-text-secondary);
    }

    .error-state {
      text-align: center;
      padding: 60px 20px;
    }

    .error-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .error-message {
      font-size: 16px;
      color: var(--color-text-secondary);
      margin-bottom: 24px;
    }

    .retry-button {
      padding: 14px 32px;
      font-size: 16px;
      font-weight: bold;
      color: var(--color-white);
      background: var(--color-primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="success-screen">
    <!-- ヘッダー -->
    <header class="success-header">
      <div class="success-header__logo">まごのTEC</div>
    </header>

    <!-- ローディング状態 -->
    <div id="loading-state" class="loading-state">
      <div class="loading-spinner"></div>
      <p class="loading-text">登録情報を確認しています...</p>
    </div>

    <!-- エラー状態 -->
    <div id="error-state" class="error-state hidden">
      <div class="error-icon">...</div>
      <p class="error-message" id="error-message">情報の取得に失敗しました</p>
      <button class="retry-button" onclick="location.reload()">再読み込み</button>
    </div>

    <!-- 成功状態 -->
    <main id="success-state" class="success-container hidden">
      <div class="success-icon">
        <div class="success-icon__circle">
          <svg class="success-icon__check" viewBox="0 0 24 24" fill="none">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>

      <h1 class="success-title">登録が完了しました</h1>
      <p class="success-subtitle">
        ありがとうございます！<br>
        下のリンクを親御さんに渡してください。
      </p>

      <div class="success-card">
        <h2 class="success-card__title">親御さん用のリンク</h2>
        <p class="success-card__description">
          このリンクを親御さんのスマホで開くと、<br>
          すぐにチャットを始められます。
        </p>

        <div class="url-box" id="pairing-url"></div>

        <button class="copy-button" id="copy-button" onclick="copyUrl()">
          リンクをコピーする
        </button>

        <div class="qr-section">
          <p class="qr-section__title">QRコードでも開けます</p>
          <div class="qr-code" id="qr-code"></div>
        </div>
      </div>

      <div class="success-tips">
        <p class="success-tips__title">親御さんに伝えてほしいこと</p>
        <ul class="success-tips__list">
          <li>リンクを開いたら、そのままチャットできます</li>
          <li>困ったことを一言で入力すればOKです</li>
          <li>会話内容は記録されないので安心です</li>
        </ul>
      </div>

      <footer class="success-footer">
        <a href="index.html" class="success-footer__link">
          アプリのトップページへ
        </a>
      </footer>
    </main>
  </div>

  <script>
    // ==============================================
    // STEP18: 成功ページ JavaScript
    // ==============================================

    const API_BASE_URL = 'https://magonotec-api.onrender.com';
    const APP_BASE_URL = 'https://aoikuruma23.github.io/magonotec-app';

    let pairingUrl = '';

    // DOM要素
    const loadingState = document.getElementById('loading-state');
    const errorState = document.getElementById('error-state');
    const successState = document.getElementById('success-state');
    const errorMessage = document.getElementById('error-message');
    const pairingUrlBox = document.getElementById('pairing-url');
    const qrCodeContainer = document.getElementById('qr-code');
    const copyButton = document.getElementById('copy-button');

    // 状態切り替え
    function showLoading() {
      loadingState.classList.remove('hidden');
      errorState.classList.add('hidden');
      successState.classList.add('hidden');
    }

    function showError(message) {
      loadingState.classList.add('hidden');
      errorState.classList.remove('hidden');
      successState.classList.add('hidden');
      errorMessage.textContent = message;
    }

    function showSuccess() {
      loadingState.classList.add('hidden');
      errorState.classList.add('hidden');
      successState.classList.remove('hidden');
    }

    // URLコピー
    function copyUrl() {
      navigator.clipboard.writeText(pairingUrl).then(() => {
        copyButton.textContent = 'コピーしました！';
        copyButton.classList.add('copy-button--copied');
        setTimeout(() => {
          copyButton.textContent = 'リンクをコピーする';
          copyButton.classList.remove('copy-button--copied');
        }, 2000);
      }).catch(() => {
        // フォールバック
        const textArea = document.createElement('textarea');
        textArea.value = pairingUrl;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        copyButton.textContent = 'コピーしました！';
        copyButton.classList.add('copy-button--copied');
        setTimeout(() => {
          copyButton.textContent = 'リンクをコピーする';
          copyButton.classList.remove('copy-button--copied');
        }, 2000);
      });
    }

    // QRコード生成
    function generateQRCode(url) {
      QRCode.toCanvas(url, {
        width: 180,
        margin: 2,
        color: {
          dark: '#000000',
          light: '#ffffff'
        }
      }, (error, canvas) => {
        if (error) {
          console.error('QR code generation failed:', error);
          qrCodeContainer.innerHTML = '<p style="color: #999; font-size: 14px;">QRコードを生成できませんでした</p>';
          return;
        }
        qrCodeContainer.innerHTML = '';
        qrCodeContainer.appendChild(canvas);
      });
    }

    // セッション情報を取得
    async function fetchPairingInfo() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');

      if (!sessionId) {
        showError('セッション情報が見つかりません');
        return;
      }

      try {
        const response = await fetch(
          `${API_BASE_URL}/api/billing/pairing-by-session?session_id=${encodeURIComponent(sessionId)}`
        );

        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.detail || 'エラーが発生しました');
        }

        const data = await response.json();

        // pairing URLを生成（STEP19: ニックネームも含める）
        pairingUrl = `${APP_BASE_URL}/?pair=${data.pairing_id}`;
        if (data.senior_name) {
          pairingUrl += `&name=${encodeURIComponent(data.senior_name)}`;
        }

        // UIを更新
        pairingUrlBox.textContent = pairingUrl;
        generateQRCode(pairingUrl);
        showSuccess();

      } catch (error) {
        console.error('Error:', error);

        // Webhookがまだ処理されていない場合はリトライ
        if (error.message.includes('pending') || error.message.includes('not found')) {
          setTimeout(fetchPairingInfo, 2000); // 2秒後にリトライ
          return;
        }

        showError(error.message || '情報の取得に失敗しました');
      }
    }

    // 初期化
    showLoading();
    fetchPairingInfo();
  </script>
</body>
</html>
