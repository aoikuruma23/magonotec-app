<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>まごのTEC - ご家族登録</title>

  <meta name="theme-color" content="#E8A0A0">
  <meta name="description" content="まごのTEC - ご家族登録ページ">

  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* 登録ページ専用スタイル */
    .register-screen {
      min-height: 100vh;
      background: var(--color-bg);
      padding: 0;
    }

    .register-header {
      background: var(--color-white);
      padding: 16px 20px;
      text-align: center;
      border-bottom: 1px solid var(--color-border);
    }

    .register-header__logo {
      font-size: 22px;
      font-weight: bold;
      color: var(--color-primary);
    }

    .register-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .register-title {
      font-size: 24px;
      font-weight: bold;
      color: var(--color-text);
      text-align: center;
      margin-bottom: 12px;
    }

    .register-subtitle {
      font-size: 16px;
      color: var(--color-text-secondary);
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .register-form {
      background: var(--color-white);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 15px;
      font-weight: bold;
      color: var(--color-text);
      margin-bottom: 8px;
    }

    .form-label--required::after {
      content: " *";
      color: var(--color-primary);
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 17px;
      border: 2px solid var(--color-border);
      border-radius: 10px;
      background: var(--color-white);
      color: var(--color-text);
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .form-input::placeholder {
      color: var(--color-text-secondary);
    }

    .form-hint {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-top: 6px;
      line-height: 1.5;
    }

    .form-checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      background: var(--color-bg);
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .form-checkbox {
      width: 24px;
      height: 24px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .form-checkbox-label {
      font-size: 14px;
      color: var(--color-text);
      line-height: 1.6;
    }

    .register-submit {
      width: 100%;
      padding: 18px 24px;
      font-size: 18px;
      font-weight: bold;
      color: var(--color-white);
      background: var(--color-primary);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .register-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .register-submit:hover:not(:disabled) {
      opacity: 0.9;
    }

    .register-price {
      text-align: center;
      margin-top: 20px;
      padding: 16px;
      background: var(--color-bg);
      border-radius: 10px;
    }

    .register-price__amount {
      font-size: 28px;
      font-weight: bold;
      color: var(--color-primary);
    }

    .register-price__unit {
      font-size: 16px;
      color: var(--color-text-secondary);
    }

    .register-price__note {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-top: 8px;
    }

    .register-footer {
      text-align: center;
      margin-top: 24px;
      padding: 20px;
    }

    .register-footer__link {
      color: var(--color-primary);
      text-decoration: underline;
      font-size: 14px;
    }

    .register-error {
      background: #FEE2E2;
      color: #DC2626;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }

    .register-canceled {
      background: #FEF3C7;
      color: #D97706;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      text-align: center;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .loading-overlay--hidden {
      display: none;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      margin-top: 16px;
      font-size: 16px;
      color: var(--color-text-secondary);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="register-screen">
    <!-- ヘッダー -->
    <header class="register-header">
      <div class="register-header__logo">まごのTEC</div>
    </header>

    <!-- メインコンテンツ -->
    <main class="register-container">
      <h1 class="register-title">ご家族登録</h1>
      <p class="register-subtitle">
        親御さんがスマホで困ったとき、<br>
        いつでも相談できるようになります。
      </p>

      <!-- キャンセル時のメッセージ -->
      <div id="canceled-message" class="register-canceled" style="display: none;">
        お支払いがキャンセルされました。<br>
        もう一度お試しください。
      </div>

      <!-- エラーメッセージ -->
      <div id="error-message" class="register-error"></div>

      <form id="register-form" class="register-form">
        <div class="form-group">
          <label class="form-label form-label--required" for="family-email">
            あなたのメールアドレス
          </label>
          <input
            type="email"
            id="family-email"
            class="form-input"
            placeholder="example@mail.com"
            required
          >
          <p class="form-hint">
            利用状況のお知らせを週1回お届けします。
          </p>
        </div>

        <div class="form-group">
          <label class="form-label" for="senior-name">
            利用者のニックネーム
          </label>
          <input
            type="text"
            id="senior-name"
            class="form-input"
            placeholder="お父さん、おばあちゃん など"
          >
          <p class="form-hint">
            省略可。メールで「○○さんの利用状況」と表示されます。
          </p>
        </div>

        <div class="form-checkbox-group">
          <input type="checkbox" id="agree-terms" class="form-checkbox" required>
          <label for="agree-terms" class="form-checkbox-label">
            会話内容は記録されません。<br>
            共有されるのは「週に何日使ったか」のみです。<br>
            個人情報（パスワード等）は入力しないでください。
          </label>
        </div>

        <button type="submit" id="submit-button" class="register-submit" disabled>
          支払いへ進む
        </button>

        <div class="register-price">
          <span class="register-price__amount">480</span>
          <span class="register-price__unit">円/月</span>
          <p class="register-price__note">
            いつでも解約できます
          </p>
        </div>
      </form>

      <footer class="register-footer">
        <a href="index.html" class="register-footer__link">
          アプリのトップページへ
        </a>
      </footer>
    </main>
  </div>

  <!-- ローディングオーバーレイ -->
  <div id="loading-overlay" class="loading-overlay loading-overlay--hidden">
    <div class="loading-spinner"></div>
    <p class="loading-text">Stripeへ移動しています...</p>
  </div>

  <script>
    // ==============================================
    // STEP18: 登録ページ JavaScript
    // ==============================================

    const API_BASE_URL = 'https://magonotec-api.onrender.com';

    // DOM要素
    const form = document.getElementById('register-form');
    const familyEmailInput = document.getElementById('family-email');
    const seniorNameInput = document.getElementById('senior-name');
    const agreeCheckbox = document.getElementById('agree-terms');
    const submitButton = document.getElementById('submit-button');
    const errorMessage = document.getElementById('error-message');
    const canceledMessage = document.getElementById('canceled-message');
    const loadingOverlay = document.getElementById('loading-overlay');

    // キャンセル時のメッセージ表示
    function checkCanceled() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('canceled') === '1') {
        canceledMessage.style.display = 'block';
        // URLをクリーン
        window.history.replaceState({}, '', window.location.pathname);
      }
    }

    // フォームバリデーション
    function validateForm() {
      const emailValid = familyEmailInput.validity.valid && familyEmailInput.value.trim() !== '';
      const agreed = agreeCheckbox.checked;
      submitButton.disabled = !(emailValid && agreed);
    }

    // エラー表示
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }

    // エラー非表示
    function hideError() {
      errorMessage.style.display = 'none';
    }

    // ローディング表示
    function showLoading() {
      loadingOverlay.classList.remove('loading-overlay--hidden');
    }

    // ローディング非表示
    function hideLoading() {
      loadingOverlay.classList.add('loading-overlay--hidden');
    }

    // フォーム送信
    async function handleSubmit(e) {
      e.preventDefault();
      hideError();

      const familyEmail = familyEmailInput.value.trim();
      const seniorName = seniorNameInput.value.trim();

      if (!familyEmail) {
        showError('メールアドレスを入力してください。');
        return;
      }

      showLoading();
      submitButton.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/api/billing/create-checkout-session`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            family_email: familyEmail,
            senior_name: seniorName || null,
            plan: 'monthly',
          }),
        });

        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.detail || 'エラーが発生しました');
        }

        const data = await response.json();

        // Stripe Checkoutへリダイレクト
        window.location.href = data.checkout_url;

      } catch (error) {
        console.error('Error:', error);
        hideLoading();
        submitButton.disabled = false;
        showError(error.message || '接続エラーが発生しました。しばらくしてからお試しください。');
      }
    }

    // イベントリスナー設定
    familyEmailInput.addEventListener('input', validateForm);
    agreeCheckbox.addEventListener('change', validateForm);
    form.addEventListener('submit', handleSubmit);

    // 初期化
    checkCanceled();
    validateForm();
  </script>
</body>
</html>
